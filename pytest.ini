[pytest]
# 1. Global Core Configuration
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 2. Automated Command Line Execution Arguments (The Heavy Lifting)
addopts = 
    -v
    -n auto
    --dist loadfile
    --browser chromium
    --embedded-services
    --alluredir=allure-results
    --clean-alluredir
    --screenshot only-on-failure
    --tracing retain-on-failure

# 3. Custom Test Categorization (Markers)
markers =
    smoke: Critical path regression tests that must pass before any deployment.
    regression: Complete end-to-end suite verification.
    authentication: Security and identity-related verification workflows.
    dashboard: Inventory and core metrics validation tests.

# 4. Standard Output Console Logging Layouts
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 5. Warning Filter Controls
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning